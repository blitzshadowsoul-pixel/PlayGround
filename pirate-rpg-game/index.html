<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grand Sea Saga - Pirate Text RPG</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:#0a1628; color:#f0e6d2; display:flex; flex-direction:column; min-height:100vh; }
  header { background:#c1272d; padding:12px; text-align:center; font-weight:900; font-size:1.2rem; letter-spacing:1px; position:sticky; top:0; z-index:10; }
  header small { display:block; font-weight:400; font-size:.75rem; opacity:.9; }
  #stats { display:flex; gap:8px; padding:8px; background:#132540; font-size:.8rem; flex-wrap:wrap; position:sticky; top:58px; z-index:9; }
  #stats div { background:#1e3a5f; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  #mapWrap { background:#081120; text-align:center; padding:4px; }
  canvas { max-width:100%; width:100%; height:140px; background:linear-gradient(#1a6daa,#0a3a5f); border-radius:8px; touch-action:none; }
  #story { flex:1; padding:16px; max-width:720px; margin:0 auto; width:100%; font-size:1.05rem; line-height:1.6; white-space:pre-wrap; }
  #choices { padding:12px; max-width:720px; margin:0 auto; width:100%; display:grid; gap:10px; padding-bottom:120px; }
  button.choice { background:#f5c518; color:#111; border:none; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; text-align:left; min-height:56px; }
  button.choice:active { transform:scale(.98); background:#ffdd33; }
  #toolbar { position:fixed; bottom:0; left:0; right:0; display:flex; gap:8px; padding:10px; background:#000000cc; backdrop-filter:blur(8px); }
  #toolbar button { flex:1; padding:12px; border-radius:10px; border:1px solid #444; background:#222; color:#fff; font-weight:700; }
  #modal { display:none; position:fixed; inset:0; background:#000000d9; z-index:50; padding:20px; overflow:auto; }
  #modalCard { background:#132540; border-radius:12px; padding:18px; max-width:520px; margin:20px auto; }
  #modalCard h2 { margin-top:0; }
  #modalCard input, #modalCard select { width:100%; padding:12px; margin:6px 0 12px; border-radius:8px; border:1px solid #555; font-size:1rem; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; }
  .btn-primary { background:#c1272d !important; color:#fff !important; border:none !important; }
  .cheatBtn { display:block; width:100%; margin:6px 0; padding:12px; border-radius:8px; background:#2a4a7a; color:#fff; border:1px solid #4a7ab5; font-weight:600; }
</style>
</head>
<body>
<header>🏴‍☠️ GRAND SEA SAGA <small>Original pirate-inspired text RPG • SFW • Mobile friendly</small></header>
<div id="stats"></div>
<div id="mapWrap"><canvas id="sea" width="700" height="140"></canvas></div>
<div id="story">Loading...</div>
<div id="choices"></div>
<div id="toolbar">
  <button onclick="openModal('char')">🎭 Hero</button>
  <button onclick="openModal('save')">💾 Save</button>
  <button onclick="openModal('cheat')">⚙️ Cheats</button>
  <button onclick="restart()">🔄 New</button>
</div>
<div id="modal"><div id="modalCard"></div></div>

<script>
// ===== Grand Sea Saga - SFW pirate text RPG =====
// Inspired by One Piece themes (adventure, crew, dreams) with ORIGINAL characters.
const S = {
  name:"", pronouns:"they/them", style:"Swordsman", origin:"East Shell Village",
  hp:100, maxHp:100, atk:10, def:5, gold:50, chapter:0, crew:[], bond:{}, flags:{},
  history:[], // for rewind cheat
};

const STYLES = {
  "Swordsman":{atk:12,def:6,hp:110,desc:"Master of three-sword flow."},
  "Brawler":{atk:14,def:8,hp:130,desc:"Fists harder than cannonballs."},
  "Sharpshooter":{atk:13,def:4,hp:90,desc:"Never misses. Sniper king."},
  "Tide Fruit User":{atk:15,def:5,hp:100,desc:"Ate a Mystic Fruit. Controls splashes. Can't swim."}
};
const ORIGINS = ["East Shell Village","Desert Sand Kingdom","Sky Cloud Island","Fishfolk Reef"];

let nodeId = "start";
let playerX = 20;

function saveHistory(){ S.history.push(JSON.stringify({nodeId,S:{...S,history:[]},playerX})); if(S.history.length>50) S.history.shift(); }
function rewind(){ if(!S.history.length){ alert("No rewind point!"); return;} const h=JSON.parse(S.history.pop()); nodeId=h.nodeId; Object.assign(S,h.S); S.history=h.S.history||S.history; playerX=h.playerX; render(); }

const NODES = {

  {t:"⚔️ Challenge Steeljaw head-on!", go:"fight1"},
  {t:"🌫️ Sneak through the foggy reef (risky)", go:"reef"},
  {t:"🤝 Recruit help at the tavern first", go:"tavern"},
  {t:"🛠️ Sabotage warship rudders at night", go:"sabotage"},
  {t:"🗺️ Ask the Old Cartographer for a secret route", go:"cartographer"},
]},

  {t:"🧭 Impress Kara with navigation riddle", go:"kara"},
  {t:"🍖 Win Borgo with appetite contest", go:"borgo"},

]},

  {t:"'The needle. Logic over heart.'", go:"joinKara2"},
  {t:"'We go east to learn why.'", go:"joinKara"},
  {t:"'We smash the Log Pose! Adventure!' ", go:"joinFun"},
  {t:"⬅️ Back to tavern", go:"tavern"},
]},
borgo:{ text:`Borgo slams a 5kg meat platter. "Eat! Strong pirates eat!"`, choices:()=>[
  {t:"Devour it all! (HP test)", go:"joinBorgo"},
  {t:"Share with the tavern kids", go:"joinBorgoKind"},

enmaPeace:{ onEnter(){addCrew("Enma")}, text:`Enma kneels. "Your heart is sky-clear. I join!"`, choices:()=>[{t:"Enter Storm Veil!",go:"finale"},{t:"Rest",go:"feast"},{t:"Train",go:"train"},{t:"Check crew",go:"enmaPeace"},{t:"Upgrade",go:"upgrade"}]},

  {t:"🔄 New Game+",go:"start"},{t:"🌤️ Free sail (explore)",go:"sand"},{t:"☁️ Visit sky",go:"sky"},{t:"📊 View hero",go:"start"},{t:"⚙️ Open cheats",go:"start"}
]},

]},

function baseAfterRecruit(){ return [{t:"⛵ Set sail to Sand Kingdom",go:"sand"},{t:"🏝️ Explore Mystery Island",go:"mystery"},{t:"⚔️ Face Steeljaw now",go:"fight1"},{t:"🍻 Recruit more in tavern",go:"tavern"},{t:"🛠️ Train (+2 ATK)",go:"train"}]; }
function baseTravel(){ return [{t:"🏜️ Sand Kingdom",go:"sand"},{t:"🏝️ Mystery Island",go:"mystery"},{t:"☁️ Sky Island",go:"sky"},{t:"⛈️ Storm Veil (finale)",go:"finale"},{t:"🍖 Feast / Heal",go:"feast"}]; }

function addCrew(n){ if(!S.crew.includes(n)){S.crew.push(n); S.bond[n]=1;} }
function bondUp(n){ S.bond[n]=(S.bond[n]||0)+1; }
function hurt(n){ S.hp=Math.max(1,S.hp-n); }
function heal(n){ S.hp=Math.min(S.maxHp,S.hp+n); }

function render(){
  const node=NODES[nodeId];
  if(node.onEnter && !node._done){ /* run once per visit? run every */ node.onEnter(); }
  document.getElementById("stats").innerHTML =
    `<div>❤️ ${S.hp}/${S.maxHp}</div><div>⚔️ ${S.atk}</div><div>🛡️ ${S.def}</div><div>🪙 ${S.gold}</div><div>👥 ${S.crew.length}</div><div>📍 ${nodeId}</div>`;
  let txt = typeof node.text==="function"?node.text():node.text;
  if(S.crew.length) txt+=`\n\nCrew: ${S.crew.join(", ")}`;
  document.getElementById("story").textContent = txt;
  const box=document.getElementById("choices"); box.innerHTML="";
  let ch = node.choices?node.choices():[];
  // fight node handling
  if(node.fight){ startFight(node, ch); return; }
  ch.forEach(c=>{
    const b=document.createElement("button"); b.className="choice"; b.textContent=c.t;
    b.onclick=()=>{ saveHistory(); if(c.go==="__rewind"){rewind();return;} nodeId=c.go; render(); drawMap(); };
    box.appendChild(b);
  });
  drawMap();
}

function startFight(node, _){
  const F=node.fight;
  let ehp=F.ehp, round=1;
  const box=document.getElementById("choices"); box.innerHTML="";
  const log=document.getElementById("story");
  function turn(playerMove){
    saveHistorySkip();
    let dmgToEnemy = Math.max(1, S.atk + rand(0,4) - 2 + (playerMove==="heavy"?4:0) + S.crew.length*2);
    let dmgToMe = Math.max(0, F.eatk + rand(-2,3) - S.def + (playerMove==="defend"?-5:0));
    if(playerMove==="defend") dmgToEnemy=Math.floor(dmgToEnemy/2);
    ehp-=dmgToEnemy; S.hp-=dmgToMe;
    log.textContent=`⚔️ ${F.enemy} — Round ${round}\nYou use ${playerMove}!\nDealt ${dmgToEnemy} dmg (Foe HP: ${Math.max(0,ehp)}).\nTook ${dmgToMe} dmg (Your HP: ${Math.max(0,S.hp)}).`+(S.crew.length?`\nCrew cheers! (+${S.crew.length*2} bonus)`:"")+`\n\nChoose next move:`;
    document.getElementById("stats").innerHTML=`<div>❤️ ${Math.max(0,S.hp)}/${S.maxHp}</div><div>⚔️ ${S.atk}</div><div>🛡️ ${S.def}</div><div>👥 ${S.crew.length}</div><div>👹 ${Math.max(0,ehp)}</div>`;
    round++;
    if(ehp<=0){ S.gold+=20; nodeId=node.win; setTimeout(render,800); box.innerHTML="<p>Victory! +20 gold...</p>"; return; }
    if(S.hp<=0){ S.hp=1; nodeId=node.lose; setTimeout(render,800); box.innerHTML="<p>Defeated...</p>"; return; }
    showMoves();
  }
  function saveHistorySkip(){ /* don't spam history in fight, push once at start */ }
  function showMoves(){
    box.innerHTML="";
    [["⚔️ Quick slash","quick"],["💥 Heavy strike","heavy"],["🛡️ Defend","defend"],["🍖 Snack (heal 15, 1/ fight)","heal"]].forEach(([label,mv])=>{
      const b=document.createElement("button"); b.className="choice"; b.textContent=label;
      b.onclick=()=>{ if(mv==="heal"){heal(15); turn("quick");} else turn(mv); };
      box.appendChild(b);
    });
    const flee=document.createElement("button"); flee.className="choice"; flee.textContent="🏃 Flee (lose 10 gold)"; flee.style.background="#ddd";
    flee.onclick=()=>{ S.gold=Math.max(0,S.gold-10); nodeId="tavern"; render(); };
    box.appendChild(flee);
  }
  log.textContent=`⚔️ WILD BATTLE: ${F.enemy} (HP ${ehp}, ATK ${F.eatk})\nYour HP ${S.hp}. Crew bonus +${S.crew.length*2} dmg!\nChoose your move — 4+ options, choose wisely!`;
  saveHistory();
  showMoves();
}
function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

// map
function drawMap(){
  const c=document.getElementById("sea"); const x=c.getContext("2d");
  x.clearRect(0,0,700,140);
  x.fillStyle="#ffd97a"; [[80,70,"Shell"],[260,50,"Mystery"],[350,90,"Sand"],[520,45,"Sky"],[640,80,"Veil"]].forEach(([ix,iy,label])=>{
    x.beginPath(); x.arc(ix,iy,18,0,7); x.fill(); x.fillStyle="#111"; x.font="10px sans-serif"; x.fillText(label,ix-20,iy+32); x.fillStyle="#ffd97a";
  });
  // player ship
  x.font="28px serif"; x.fillText("🏴‍☠️",playerX,70);
  x.fillStyle="#fff"; x.font="11px sans-serif"; x.fillText(S.name||"YOU",playerX-10,100);
}

function openModal(kind){
  const m=document.getElementById("modal"), card=document.getElementById("modalCard");
  m.style.display="block";
  if(kind==="char"){
    card.innerHTML=`<h2>🎭 Customize Hero</h2>
    <label>Name</label><input id="fName" value="${S.name}" placeholder="e.g. Monkey... use your own!">
    <label>Pronouns</label><select id="fPro"><option>${S.pronouns}</option><option>he/him</option><option>she/her</option><option>they/them</option></select>
    <label>Fighting Style</label><select id="fStyle">${Object.keys(STYLES).map(k=>`<option ${k===S.style?"selected":""}>${k}</option>`).join("")}</select>
    <label>Origin</label><select id="fOrg">${ORIGINS.map(k=>`<option ${k===S.origin?"selected":""}>${k}</option>`).join("")}</select>
    <div class="row"><button class="cheatBtn btn-primary" onclick="saveChar()">Save</button><button class="cheatBtn" onclick="closeModal()">Close</button></div>
    <p style="opacity:.7">Styles: ${Object.entries(STYLES).map(([k,v])=>k+": "+v.desc).join("<br>")}</p>`;
  } else if(kind==="save"){
    card.innerHTML=`<h2>💾 Save / Load</h2>
    <button class="cheatBtn" onclick="saveGame(1)">Save Slot 1</button>
    <button class="cheatBtn" onclick="loadGame(1)">Load Slot 1</button>
    <button class="cheatBtn" onclick="saveGame(2)">Save Slot 2</button>
    <button class="cheatBtn" onclick="loadGame(2)">Load Slot 2</button>
    <button class="cheatBtn" onclick="closeModal()">Close</button>`;
  } else {
    card.innerHTML=`<h2>⚙️ Cheats & Rewind</h2><p>Side-menu cheats — for fun / testing, not progression.</p>
    <button class="cheatBtn" onclick="rewindCheat()">↩️ Rewind one choice</button>
    <button class="cheatBtn" onclick="cheat('god')">✨ God Mode (999 HP/ATK)</button>
    <button class="cheatBtn" onclick="cheat('gold')">🪙 +500 Gold</button>
    <button class="cheatBtn" onclick="cheat('heal')">❤️ Full Heal</button>
    <button class="cheatBtn" onclick="cheat('crew')">👥 Recruit All</button>
    <button class="cheatBtn" onclick="cheat('boss')">⛈️ Teleport to Finale</button>
    <button class="cheatBtn" onclick="cheat('clear')">🧹 Normal Mode (reset buffs)</button>
    <button class="cheatBtn" onclick="closeModal()">Close</button>`;
  }
}
function closeModal(){ document.getElementById("modal").style.display="none"; }
function saveChar(){
  S.name=document.getElementById("fName").value||"Lucky";
  S.pronouns=document.getElementById("fPro").value;
  S.style=document.getElementById("fStyle").value;
  S.origin=document.getElementById("fOrg").value;
  const st=STYLES[S.style]; S.atk=st.atk; S.def=st.def; S.maxHp=st.hp; S.hp=st.hp;
  closeModal(); render();
}
function saveGame(slot){ localStorage.setItem("gss"+slot, JSON.stringify({nodeId,S:{...S,history:[]},playerX})); alert("Saved!"); closeModal(); }
function loadGame(slot){ const d=localStorage.getItem("gss"+slot); if(!d){alert("Empty");return;} const h=JSON.parse(d); nodeId=h.nodeId; Object.assign(S,h.S); playerX=h.playerX; closeModal(); render(); }
function rewindCheat(){ closeModal(); rewind(); }
function cheat(k){
  if(k==="god"){S.maxHp=999;S.hp=999;S.atk=99;S.def=50;}
  if(k==="gold"){S.gold+=500;}
  if(k==="heal"){S.hp=S.maxHp;}
  if(k==="crew"){["Kara","Borgo","Pico","Mira","Enma","Lin"].forEach(addCrew);}
  if(k==="boss"){saveHistory(); nodeId="finale";}
  if(k==="clear"){const st=STYLES[S.style]; S.atk=st.atk; S.def=st.def; S.maxHp=st.hp;}
  closeModal(); render();
}
function restart(){ if(confirm("Restart story?")){ saveHistory(); nodeId="start"; playerX=20; render(); openModal('char'); } }
document.getElementById("modal").onclick=e=>{ if(e.target.id==="modal") closeModal(); };

openModal('char');
render();
</script>
</body>
